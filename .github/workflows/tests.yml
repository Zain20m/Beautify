name: Beautifier tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile beautifier
        run: python -m py_compile scripts/beautify.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test examples
        run: |
          python scripts/beautify.py examples/before.lua -o /tmp/beautified.lua --report
          python scripts/beautify.py examples/before_extreme.lua -o /tmp/beautified-extreme.lua --report
