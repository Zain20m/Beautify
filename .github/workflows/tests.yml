name: Beautifier tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AST analysis dependencies
        run: python -m pip install -r requirements.txt
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: false
      - name: Compile beautifier
        run: python -m py_compile scripts/beautify.py scripts/luau_ast.py
      - name: Run regression and generated-invariant tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test examples with the Luau parser
        run: |
          python scripts/beautify.py examples/before.lua -o /tmp/beautified.lua --formatter stylua --report
          python scripts/beautify.py examples/before_extreme.lua -o /tmp/beautified-extreme.lua --formatter stylua --report
